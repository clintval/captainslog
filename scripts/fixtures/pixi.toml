[workspace]
name = "captainslog-fixtures"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
openjdk = "*"
picard = { version = "==3.5.0", channel = "bioconda" }
r-base = "*"
riker = { version = "==0.5.0", channel = "bioconda" }
samtools = { version = "*", channel = "bioconda" }

[activation.env]
PATH = "$CONDA_PREFIX/lib/jvm/bin:$PATH"
PICARD_JAR = "$CONDA_PREFIX/share/picard-3.5.0-0/picard.jar"
